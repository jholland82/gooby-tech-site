{{ define "main" }}
<div class="section">
  <div class="container">
    <div class="section-header">
      <h1 class="section-title">{{ .Title }}</h1>
      {{ with .Description }}
      <p class="section-desc">{{ . }}</p>
      {{ end }}
    </div>

    <div class="grid-3">
      {{ range .Pages }}
      <div class="card">
        <h3 class="card-title">{{ .Title }}</h3>
        <p class="card-desc">{{ .Summary | truncate 140 }}</p>
        <a href="{{ .RelPermalink }}" class="card-link">Read More →</a>
      </div>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
