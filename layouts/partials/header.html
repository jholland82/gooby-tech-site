<header class="site-header">
  <div class="container nav-wrapper">
    <!-- Brand Logo -->
    <a href="{{ .Site.BaseURL }}" class="brand-link" aria-label="{{ .Site.Params.company_name }} Home">
      <svg class="brand-logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#0F172A"/>
        <path d="M12 24C12 17.3726 17.3726 12 24 12C28.2 12 31.8 14.2 33.8 17.5L28.6 20.5C27.5 18.7 25.8 17.6 24 17.6C20.5 17.6 17.6 20.5 17.6 24C17.6 27.5 20.5 30.4 24 30.4C26.5 30.4 28.6 29 29.7 26.8H23V21.6H35.2V25C35.2 31.2 30.2 36 24 36C17.3726 36 12 30.6274 12 24Z" fill="url(#navLogoGrad)"/>
        <defs>
          <linearGradient id="navLogoGrad" x1="12" y1="12" x2="35.2" y2="36" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38BDF8"/>
            <stop offset="0.5" stop-color="#6366F1"/>
            <stop offset="1" stop-color="#A855F7"/>
          </linearGradient>
        </defs>
      </svg>
      <span>GOOBY<span class="text-cyan">TECH</span></span>
    </a>

    <!-- Navigation Menu -->
    <nav>
      <ul class="nav-menu" id="nav-menu">
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="nav-link {{ if $currentPage.IsMenuCurrent "main" . }}active{{ else if $currentPage.HasMenuCurrent "main" . }}active{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>

    <!-- Header Actions (Theme Toggle & CTA) -->
    <div class="nav-actions">
      {{ if .Site.Params.enable_theme_toggle }}
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <!-- Sun Icon (for Dark Theme) -->
        <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (for Light Theme) -->
        <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      {{ end }}

      <a href="/contact/" class="btn btn-primary" style="padding: 0.6rem 1.15rem; font-size: 0.875rem;">
        Get in Touch
      </a>

      <!-- Mobile Menu Toggle Button -->
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>
