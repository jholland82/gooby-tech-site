<header class="site-header">
  <div class="container nav-wrapper">
    <!-- Brand Logo -->
    <a href="{{ .Site.BaseURL }}" class="brand-link" aria-label="{{ .Site.Params.company_name }} Home">
      <svg class="brand-logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#0A1811"/>
        <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#10B981" stroke-opacity="0.35"/>
        <defs>
          <linearGradient id="navTrexGrad" x1="12" y1="9" x2="38" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#34D399"/>
            <stop offset="0.5" stop-color="#10B981"/>
            <stop offset="1" stop-color="#059669"/>
          </linearGradient>
          <linearGradient id="navTrexBelly" x1="22" y1="20" x2="30" y2="38" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A7F3D0"/>
            <stop offset="1" stop-color="#6EE7B7"/>
          </linearGradient>
        </defs>
        <!-- Spikes -->
        <path d="M15 13L12 11L14 16Z" fill="#6EE7B7"/>
        <path d="M11 19L8 18L11 22Z" fill="#6EE7B7"/>
        <path d="M9 25L6 25L9 28Z" fill="#6EE7B7"/>
        <!-- Body -->
        <path d="M 16 11 C 22 9, 29 9, 36 10 C 38.5 10.3, 40 12, 40 15 C 40 17.5, 38.5 19, 36 19.5 L 31 19.5 C 30 20.5, 30.5 22, 32 22.5 L 36 22.5 C 37.5 22.5, 38 24, 37.5 25.5 C 37 26.5, 35.5 27, 33 27 C 29.5 27, 28 28.5, 28 31 C 28.5 34, 29 36.5, 29 39 L 25 39 C 25 36.5, 24.5 35, 23 35 C 21.5 35, 21 37, 20.5 39 L 17 39 C 17.5 35.5, 18 33, 17 31 C 14 31, 10 33, 6 29 C 6 27, 8.5 26, 12 25 C 13.5 23, 14 19, 14 15 C 14 12.5, 14.5 11.5, 16 11 Z" fill="url(#navTrexGrad)"/>
        <!-- Belly -->
        <path d="M 28 27 C 29.5 27, 31 27.5, 31.5 28.5 C 31 31, 30 34, 28.5 36 C 27 36, 25 34.5, 25 32 C 25 29.5, 26.5 27.5, 28 27 Z" fill="url(#navTrexBelly)" opacity="0.85"/>
        <!-- Arm -->
        <path d="M 29 27.5 C 32 27.5, 33.5 29, 33 30.5 C 32.5 31.5, 31 31, 29.5 29.5 Z" fill="#34D399"/>
        <!-- Eye -->
        <ellipse cx="25.5" cy="14.5" rx="3.5" ry="4" fill="#FFFFFF"/>
        <ellipse cx="26.2" cy="14.5" rx="2" ry="2.5" fill="#064E3B"/>
        <circle cx="27" cy="13.5" r="0.9" fill="#FFFFFF"/>
        <!-- Smile & Cheek -->
        <path d="M 32 19.5 L 33.5 21.5 L 35 19.5 Z" fill="#FFFFFF"/>
        <circle cx="37.5" cy="13.5" r="0.75" fill="#064E3B" opacity="0.6"/>
        <ellipse cx="27.5" cy="18.5" rx="1.8" ry="1.2" fill="#F472B6" opacity="0.45"/>
      </svg>
      <span>GOOBY <span class="text-green">TECHNOLOGIES, LLC</span></span>
    </a>

    <!-- Navigation Menu -->
    <nav>
      <ul class="nav-menu" id="nav-menu">
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="nav-link {{ if $currentPage.IsMenuCurrent "main" . }}active{{ else if $currentPage.HasMenuCurrent "main" . }}active{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>

    <!-- Header Actions (Theme Toggle & CTA) -->
    <div class="nav-actions">
      {{ if .Site.Params.enable_theme_toggle }}
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <!-- Sun Icon (for Dark Theme) -->
        <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (for Light Theme) -->
        <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      {{ end }}

      <a href="/contact/" class="btn btn-primary" style="padding: 0.6rem 1.15rem; font-size: 0.875rem;">
        Get in Touch
      </a>

      <!-- Mobile Menu Toggle Button -->
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>
