<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" fill="none">
  <!-- Friendly T-Rex Icon (40x40 at x=0, y=4) -->
  <g transform="translate(0, 4) scale(0.8333)">
    <!-- Container -->
    <rect width="48" height="48" rx="12" fill="#0A1811"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#10B981" stroke-opacity="0.35"/>

    <defs>
      <linearGradient id="logoTrexGrad" x1="12" y1="9" x2="38" y2="42" gradientUnits="userSpaceOnUse">
        <stop stop-color="#34D399"/>
        <stop offset="0.5" stop-color="#10B981"/>
        <stop offset="1" stop-color="#059669"/>
      </linearGradient>
      <linearGradient id="logoTrexBelly" x1="22" y1="20" x2="30" y2="38" gradientUnits="userSpaceOnUse">
        <stop stop-color="#A7F3D0"/>
        <stop offset="1" stop-color="#6EE7B7"/>
      </linearGradient>
    </defs>

    <!-- Spikes on Back -->
    <path d="M15 13L12 11L14 16Z" fill="#6EE7B7"/>
    <path d="M11 19L8 18L11 22Z" fill="#6EE7B7"/>
    <path d="M9 25L6 25L9 28Z" fill="#6EE7B7"/>

    <!-- Tail, Body & Head -->
    <path d="
      M 16 11
      C 22 9, 29 9, 36 10
      C 38.5 10.3, 40 12, 40 15
      C 40 17.5, 38.5 19, 36 19.5
      L 31 19.5
      C 30 20.5, 30.5 22, 32 22.5
      L 36 22.5
      C 37.5 22.5, 38 24, 37.5 25.5
      C 37 26.5, 35.5 27, 33 27
      C 29.5 27, 28 28.5, 28 31
      C 28.5 34, 29 36.5, 29 39
      L 25 39
      C 25 36.5, 24.5 35, 23 35
      C 21.5 35, 21 37, 20.5 39
      L 17 39
      C 17.5 35.5, 18 33, 17 31
      C 14 31, 10 33, 6 29
      C 6 27, 8.5 26, 12 25
      C 13.5 23, 14 19, 14 15
      C 14 12.5, 14.5 11.5, 16 11
      Z
    " fill="url(#logoTrexGrad)"/>

    <!-- Lighter Belly -->
    <path d="
      M 28 27
      C 29.5 27, 31 27.5, 31.5 28.5
      C 31 31, 30 34, 28.5 36
      C 27 36, 25 34.5, 25 32
      C 25 29.5, 26.5 27.5, 28 27
      Z
    " fill="url(#logoTrexBelly)" opacity="0.85"/>

    <!-- Cute Little T-Rex Arm -->
    <path d="M 29 27.5 C 32 27.5, 33.5 29, 33 30.5 C 32.5 31.5, 31 31, 29.5 29.5 Z" fill="#34D399"/>

    <!-- Cute Big Eye -->
    <ellipse cx="25.5" cy="14.5" rx="3.5" ry="4" fill="#FFFFFF"/>
    <ellipse cx="26.2" cy="14.5" rx="2" ry="2.5" fill="#064E3B"/>
    <circle cx="27" cy="13.5" r="0.9" fill="#FFFFFF"/>
    <circle cx="25.5" cy="15.5" r="0.4" fill="#FFFFFF"/>

    <!-- Happy Smile / Little Tooth -->
    <path d="M 32 19.5 L 33.5 21.5 L 35 19.5 Z" fill="#FFFFFF"/>

    <!-- Cute Nostril -->
    <circle cx="37.5" cy="13.5" r="0.75" fill="#064E3B" opacity="0.6"/>

    <!-- Friendly Cheek Blush -->
    <ellipse cx="27.5" cy="18.5" rx="1.8" ry="1.2" fill="#F472B6" opacity="0.45"/>
  </g>

  <!-- Brand Typography -->
  <text x="50" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" letter-spacing="-0.02em" fill="currentColor">
    GOOBY <tspan fill="#10B981">TECHNOLOGIES, LLC</tspan>
  </text>
  <text x="51" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.18em" fill="#9BB3A5">
    SOFTWARE ENGINEERING
  </text>
</svg>
