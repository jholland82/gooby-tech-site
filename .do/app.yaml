name: gooby-tech

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
      preserve_path_prefix: true
    - component:
        name: gooby-tech
      match:
        path:
          prefix: /

functions:
  - name: api
    github:
      repo: jholland82/gooby_tech
      branch: main
      deploy_on_push: true
    source_dir: functions
    envs:
      - key: RESEND_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: CONTACT_TO_EMAIL
        scope: RUN_TIME
        value: hello@goobytech.com
      - key: CONTACT_FROM_EMAIL
        scope: RUN_TIME
        value: onboarding@resend.dev

static_sites:
  - name: gooby-tech
    github:
      repo: jholland82/gooby_tech
      branch: main
      deploy_on_push: true
    # Built with the Node.js buildpack: npm installs Hugo (hugo-extended),
    # then `npm run build` runs `hugo --minify`.
    environment_slug: node-js
    build_command: npm run build
    output_dir: public
    error_document: 404.html
    envs:
      - key: HUGO_ENVIRONMENT
        value: production
        scope: BUILD_TIME
