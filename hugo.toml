  description = 'Gooby Tech is a premium software engineering consultancy. We design and build enterprise-grade distributed systems, cloud-native architectures, and high-performance web applications.'
  author = 'Gooby Tech Engineering Team'
  email = 'hello@goobytech.com'
  phone = '+1 (555) 234-5678'
  location = 'San Francisco, CA & Remote Global'
  availability = 'Accepting new projects for Q4 & 2027'
  calendly_url = 'https://calendly.com'
  github_url = 'https://github.com'
  linkedin_url = 'https://linkedin.com'
  twitter_url = 'https://x.com'

  # Contact form endpoint (e.g., https://formspree.io/f/your-id or leave empty for mailto fallback)
  formspree_endpoint = ''

  # Feature flags & UI
  enable_theme_toggle = true
  enable_reading_time = true
  enable_table_of_contents = true

